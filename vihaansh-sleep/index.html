<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#596be0"><link rel="manifest" href="manifest.json"><title>Vihaansh Sleep</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7ff;color:#17203a}.app{max-width:560px;margin:auto;min-height:100vh;padding:16px}.hero{background:linear-gradient(135deg,#596be0,#8792f2);color:#fff;border-radius:26px;padding:22px}h1{margin:0}.sub{opacity:.9}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}button{border:0;border-radius:15px;padding:12px;font-weight:700}.tab{background:#fff;color:#59617a}.active,.action{background:#596be0;color:#fff}.card{background:#fff;border-radius:21px;padding:17px;margin:11px 0;box-shadow:0 5px 18px #25315b0d}.big{font-size:38px;font-weight:800;margin:8px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.secondary{background:#edf0ff;color:#4d5ac2;width:100%}.muted{color:#747d96}.hidden{display:none}.pill{background:#edf0ff;color:#596be0;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.history{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:11px 0}.sound{padding:12px;border:1px solid #e5e8f4;border-radius:15px;margin:8px 0}.sound button{float:right;padding:8px 12px}textarea{width:100%;padding:11px;border:1px solid #dfe3ef;border-radius:11px;font:inherit}</style></head><body><main class="app"><section class="hero"><h1>🌙 Vihaansh Sleep</h1><div class="sub">Sleep & nap tracking for parents</div></section><nav class="tabs"><button class="tab active" data-tab="track">Track</button><button class="tab" data-tab="sounds">Sounds</button><button class="tab" data-tab="dashboard">Dashboard</button></nav><section id="track"><div class="card"><span class="pill">NIGHT SLEEP</span><div id="sleepTimer" class="big">00:00:00</div><div class="grid"><button class="action" id="sleepBtn">Start Sleep</button><button class="secondary" id="wakeBtn">Wake Up</button></div></div><div class="card"><span class="pill">NAP</span><div id="napTimer" class="big">00:00:00</div><div class="grid"><button class="action" id="napBtn">Start Nap</button><button class="secondary" id="napEndBtn">End Nap</button></div></div><div class="card"><b>Today's note</b><textarea id="note" rows="3" placeholder="Optional sleep notes"></textarea><button class="secondary" style="margin-top:9px" id="saveNote">Save Note</button></div></section><section id="sounds" class="hidden"><div class="card"><h2>Soothing sounds</h2><p class="muted">Keep volume low and phone safely away.</p><div class="sound">🌧️ Rain <button class="secondary play">Play</button></div><div class="sound">🌊 Ocean <button class="secondary play">Play</button></div><div class="sound">🎵 Gentle tone <button class="secondary play">Play</button></div><p id="audioStatus" class="muted">No sound playing</p></div></section><section id="dashboard" class="hidden"><div class="card"><span class="pill">TODAY</span><div id="todayTotal" class="big">0h 0m</div><div class="muted">Recorded sleep + naps</div></div><div class="card"><h2>Recent sessions</h2><div id="history"></div></div></section></main><script>const K='vihaanshSleepV1';let d=JSON.parse(localStorage.getItem(K)||'{"sessions":[],"note":"","active":null}'),audio=null;const save=()=>{localStorage.setItem(K,JSON.stringify(d));render()},fmt=x=>{let s=Math.floor(Math.max(0,x)/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60;return[h,m,z].map(v=>String(v).padStart(2,'0')).join(':')};function render(){sleepTimer.textContent=d.active?.type==='sleep'?fmt(Date.now()-d.active.start):'00:00:00';napTimer.textContent=d.active?.type==='nap'?fmt(Date.now()-d.active.start):'00:00:00';note.value=d.note||'';let day=new Date().toDateString(),t=d.sessions.filter(x=>new Date(x.start).toDateString()===day).reduce((a,x)=>a+x.duration,0);todayTotal.textContent=Math.floor(t/36e5)+'h '+Math.floor(t%36e5/6e4)+'m';history.innerHTML=d.sessions.slice(-12).reverse().map(x=>'<div class="history"><span>'+(x.type==='sleep'?'🌙':'😴')+' '+x.type+'</span><b>'+Math.round(x.duration/6e4)+' min</b></div>').join('')||'<p class="muted">No sessions yet.</p>'}function finish(t){if(!d.active||d.active.type!==t)return;let e=Date.now();d.sessions.push({type:t,start:d.active.start,end:e,duration:e-d.active.start});d.active=null;save()}sleepBtn.onclick=()=>{if(!d.active){d.active={type:'sleep',start:Date.now()};save()}};wakeBtn.onclick=()=>finish('sleep');napBtn.onclick=()=>{if(!d.active){d.active={type:'nap',start:Date.now()};save()}};napEndBtn.onclick=()=>finish('nap');saveNote.onclick=()=>{d.note=note.value;save()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')});document.querySelectorAll('.play').forEach(b=>b.onclick=()=>{if(audio){audio.stop();audio=null;audioStatus.textContent='No sound playing';return}let A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=180;g.gain.value=.018;o.connect(g);g.connect(a.destination);o.start();audio={stop:()=>{o.stop();a.close()}};audioStatus.textContent='🔊 Gentle sound playing'});setInterval(render,1e3);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
