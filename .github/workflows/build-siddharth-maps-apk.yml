name: Build Siddharth Maps APK
on:
  push:
    paths:
      - 'android-map/**'
      - '.github/workflows/build-siddharth-maps-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        working-directory: android-map
        run: gradle assembleRelease --no-daemon
      - name: Prepare APK
        run: cp android-map/app/build/outputs/apk/release/app-release-unsigned.apk SiddharthMaps.apk
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siddharth-maps-v1.0.0
          name: Siddharth Maps v1.0.0
          body: Android APK build of Siddharth Maps.
          files: SiddharthMaps.apk
