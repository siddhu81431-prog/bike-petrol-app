name: Build Siddharth Maps APK
on:
  push:
    paths:
      - 'android-map/**'
      - '.github/workflows/build-siddharth-maps-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        working-directory: android-map
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android-map/app/build/outputs/apk/debug/app-debug.apk SiddharthMaps.apk
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siddharth-maps-v1.0.2
          name: Siddharth Maps v1.0.2
          body: Installable Android debug APK build of Siddharth Maps.
          files: SiddharthMaps.apk
