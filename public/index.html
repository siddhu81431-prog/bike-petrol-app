<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="/manifest.json"><title>Bike Petrol Tracker</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#eef2f7;color:#0f172a}main{max-width:560px;margin:auto;padding:18px 14px 40px}.hero{background:#0f172a;color:white;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 8px 25px #0f172a22}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:#cbd5e1;font-size:14px}.card{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0f172a12}.card h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f8fafc;padding:13px;border-radius:14px}.stat span{display:block;color:#64748b;font-size:12px}.stat b{display:block;font-size:20px;margin-top:4px}.green{color:#15803d}.red{color:#b91c1c}.blue{color:#1d4ed8}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;background:#fff}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0f172a;color:white;font-size:16px;font-weight:700;margin-top:15px}button:active{transform:scale(.99)}.muted{color:#64748b;font-size:13px}.entry{padding:12px 0;border-bottom:1px solid #e2e8f0}.entry:last-child{border:0}.row{display:flex;justify-content:space-between;gap:8px}.small{font-size:12px;color:#64748b}.badge{font-size:11px;background:#e2e8f0;padding:3px 7px;border-radius:8px}
</style></head><body><main>
<div class="hero"><h1>🏍️ Bike Petrol Tracker</h1><p>Fuel • Earnings • Mileage • Net Income</p></div>
<div class="card"><h2>⛽ Add Fuel</h2>
<label>Petrol price (₹/L)</label><input id="price" type="number" step="0.01" placeholder="e.g. 115.69">
<label>Petrol filled (litres)</label><input id="litres" type="number" step="0.01" placeholder="e.g. 2">
<label>Amount paid (₹)</label><input id="amount" type="number" step="0.01" placeholder="Auto-calculated if blank">
<label>Current odometer (km)</label><input id="odo" type="number" step="0.1" placeholder="e.g. 12540">
<label>Today's earnings (₹)</label><input id="earnings" type="number" step="0.01" placeholder="Optional">
<button onclick="save()">Save Entry</button></div>
<div class="card"><h2>📊 Overall Summary</h2><div class="grid">
<div class="stat"><span>Total fuel</span><b id="fuel">0 L</b></div><div class="stat"><span>Fuel spend</span><b id="spend">₹0</b></div>
<div class="stat"><span>Avg mileage</span><b id="mileage">—</b></div><div class="stat"><span>Cost / km</span><b id="cost">—</b></div>
<div class="stat"><span>Total earnings</span><b id="earningsTotal" class="blue">₹0</b></div><div class="stat"><span>Net after fuel</span><b id="net" class="green">₹0</b></div>
</div></div>
<div class="card"><h2>📅 Today</h2><div class="grid">
<div class="stat"><span>Today's earnings</span><b id="todayEarn">₹0</b></div><div class="stat"><span>Today's fuel</span><b id="todayFuel">₹0</b></div>
<div class="stat"><span>Today's net</span><b id="todayNet" class="green">₹0</b></div><div class="stat"><span>Entries</span><b id="count">0</b></div>
</div></div>
<div class="card"><h2>🧾 Recent entries</h2><div id="history" class="muted">No entries yet.</div></div>
</main>
<script>
const key='bikeFuelEntries';let entries=JSON.parse(localStorage.getItem(key)||'[]');
function save(){const price=+priceEl.value||0,litres=+litresEl.value||0,amount=+amountEl.value||litres*price,odo=+odoEl.value||0,earnings=+earningsEl.value||0;if(!litres||!odo){alert('Enter litres and odometer');return}entries.push({date:new Date().toISOString(),price,litres,amount,odo,earnings});localStorage.setItem(key,JSON.stringify(entries));litresEl.value='';amountEl.value='';earningsEl.value='';render()}
const priceEl=document.getElementById('price'),litresEl=document.getElementById('litres'),amountEl=document.getElementById('amount'),odoEl=document.getElementById('odo'),earningsEl=document.getElementById('earnings');
function render(){const fuel=entries.reduce((a,e)=>a+e.litres,0),spend=entries.reduce((a,e)=>a+e.amount,0),earn=entries.reduce((a,e)=>a+(e.earnings||0),0),distance=entries.length>1?Math.max(0,entries[entries.length-1].odo-entries[0].odo):0;document.getElementById('fuel').textContent=fuel.toFixed(2)+' L';document.getElementById('spend').textContent='₹'+spend.toFixed(2);document.getElementById('mileage').textContent=distance>0&&fuel>0?(distance/fuel).toFixed(1)+' km/L':'—';document.getElementById('cost').textContent=distance>0?'₹'+(spend/distance).toFixed(2):'—';document.getElementById('earningsTotal').textContent='₹'+earn.toFixed(2);document.getElementById('net').textContent='₹'+(earn-spend).toFixed(2);const today=new Date().toDateString(),te=entries.filter(e=>new Date(e.date).toDateString()===today),tf=te.reduce((a,e)=>a+e.amount,0),tr=te.reduce((a,e)=>a+(e.earnings||0),0);document.getElementById('todayEarn').textContent='₹'+tr.toFixed(2);document.getElementById('todayFuel').textContent='₹'+tf.toFixed(2);document.getElementById('todayNet').textContent='₹'+(tr-tf).toFixed(2);document.getElementById('count').textContent=entries.length;document.getElementById('history').innerHTML=entries.slice().reverse().map(e=>{const d=new Date(e.date);return '<div class="entry"><div class="row"><b>'+d.toLocaleDateString()+'</b><span class="badge">'+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div><div class="small">'+e.litres+' L · ₹'+e.amount.toFixed(2)+' fuel · Odo '+e.odo+' km · Earnings ₹'+(e.earnings||0).toFixed(2)+'</div></div>'}).join('')||'No entries yet.'}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
