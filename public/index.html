<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><title>Bike Petrol Tracker</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}main{max-width:520px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{margin:8px 0}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px;margin-top:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f9fafb;padding:12px;border-radius:12px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:#6b7280;font-size:13px}</style></head><body><main><h1>🏍️ Bike Petrol Tracker</h1><div class="muted">Track fuel, mileage and running cost</div><div class="card"><label>Petrol price (₹/L)</label><input id="price" type="number" step="0.01" placeholder="e.g. 115.69"><label>Petrol filled (litres)</label><input id="litres" type="number" step="0.01"><label>Amount paid (₹)</label><input id="amount" type="number" step="0.01"><label>Current odometer (km)</label><input id="odo" type="number" step="0.1"><button onclick="save()">Save Fuel Entry</button></div><div class="card"><h2>Summary</h2><div class="stats"><div class="stat">Total fuel<b id="fuel">0 L</b></div><div class="stat">Total spend<b id="spend">₹0</b></div><div class="stat">Mileage<b id="mileage">—</b></div><div class="stat">Cost/km<b id="cost">—</b></div></div></div><div class="card"><h2>Recent entries</h2><div id="history" class="muted">No entries yet.</div></div></main><script>const key='bikeFuelEntries';let entries=JSON.parse(localStorage.getItem(key)||'[]');function save(){const price=+document.getElementById('price').value||0,litres=+document.getElementById('litres').value||0,amount=+document.getElementById('amount').value||litres*price,odo=+document.getElementById('odo').value||0;if(!litres||!odo){alert('Enter litres and odometer');return}entries.push({date:new Date().toLocaleString(),price,litres,amount,odo});localStorage.setItem(key,JSON.stringify(entries));render()}function render(){let fuel=entries.reduce((a,e)=>a+e.litres,0),spend=entries.reduce((a,e)=>a+e.amount,0),distance=entries.length>1?entries[entries.length-1].odo-entries[0].odo:0;document.getElementById('fuel').textContent=fuel.toFixed(2)+' L';document.getElementById('spend').textContent='₹'+spend.toFixed(2);document.getElementById('mileage').textContent=distance>0?(fuel>0?(distance/fuel).toFixed(1)+' km/L':'—'):'—';document.getElementById('cost').textContent=distance>0?'₹'+(spend/distance).toFixed(2):'—';document.getElementById('history').innerHTML=entries.slice().reverse().map(e=>`<div style="padding:9px 0;border-bottom:1px solid #eee">${e.date}<br><b>${e.litres} L · ₹${e.amount.toFixed(2)}</b> · Odo ${e.odo} km</div>`).join('')||'No entries yet.'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
